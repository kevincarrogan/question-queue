# just check on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: uv sync --locked
      - run: just check
