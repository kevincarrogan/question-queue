[project]
name = "question-queue"
version = "0.1.0"
description = "A keyboard-driven queue of nested questions, kept in a markdown file"
readme = "README.md"
authors = [
    { name = "Kevin Carrogan", email = "kevin@carrogan.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
    "watchfiles>=1.3.0",
]

[project.scripts]
qq = "questionqueue.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "questionqueue"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length; this only fires on long docstrings and strings.
# RUF012 wants ClassVar on Textual's BINDINGS/CSS class attributes.
ignore = ["E501", "RUF012"]

[tool.mypy]
strict = true
files = ["src", "tests"]
